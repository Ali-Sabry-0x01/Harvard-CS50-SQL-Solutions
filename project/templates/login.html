{% extends "layout.html" %}
{% block title %}Log In{% endblock %}
{% block main %}
    <h2>Log In</h2>
    {% if error %}<p class="text-danger">{{ error }}</p>{% endif %}
    <form action="/login" method="post" class="mt-3">
        <div class="mb-3"><input class="form-control mx-auto w-auto" name="username" placeholder="Username" type="text"></div>
        <div class="mb-3"><input class="form-control mx-auto w-auto" name="password" placeholder="Password" type="password"></div>
        <button class="btn btn-primary" type="submit">Log In</button>
    </form>
{% endblock %}
